[package]
name = "mashvoice-tauri"
version = "1.0.7"
description = "MashVoice Singularity 4.4 — Native Rust Desktop & Mobile Shell (Tauri v2)"
authors = ["MyMasha"]
license = "MIT"
edition = "2021"

[lib]
name = "mashvoice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
axum = "0.7"
mashvoice-core = { path = "../crates/mashvoice-core" }
mashvoice-server = { path = "../crates/mashvoice-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-updater = "2.5"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
incremental = false
strip = "symbols"
