name: MashVoice Rust + Tauri v2 Release & Auto-Updater

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    if: github.repository == 'MyMasha/MashVoice'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UI dependencies
        run: npm install

      - name: Build & Publish Rust Tauri v2 Windows Release (.exe / .msi) + Signed Auto-Updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'MashVoice Singularity v__VERSION__ (Windows x64 • MashKrisp IA & Zero-IP Zyntra)'
          releaseBody: |
            ### ✨ MashVoice Singularity v__VERSION__ (Windows x64 • Rust + Tauri v2)
            - **🛡️ MashKrisp™ IA (Isolation Vocale Anti-Clavier)** : Filtre DSP `AudioWorklet` temps réel supprimant les clics de clavier mécanique, souffles PC et bruits de bureau.
            - **🎙️ Réparation & Hot-Plug Micro Instantané** : Redemande d'autorisation micro en 1 clic et remplacement à chaud sur les appels actifs.
            - **🎵 Musiques d'Appels & Sons UI** : Sonnerie d'appel entrant, musique d'attente d'appel sortant, sons de messages, vocal et stream.
            - **⚙️ Paramètres Serveur Complets & Menu Clic-Droit** : Menu contextuel complet + administration multi-onglets.
            - **🚀 Auto-Updater 1-Clic Sans SmartScreen & Changelog** : Pastille dorée `Mise à jour`, remplacement atomique `.exe` sans `Zone.Identifier` et affichage automatique du Changelog au redémarrage.

            #### ⚡ Installation Rapide Sans Pop-Up Bleue SmartScreen (PowerShell)
            ```powershell
            irm https://github.com/MyMasha/MashVoice/releases/latest/download/install-mashvoice.ps1 | iex
            ```
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true

      - name: Package Portable ZIP & Upload SmartScreen-Free Installer Script
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          $portableExe = "src-tauri/target/release/mashvoice-tauri.exe"
          $zipPath = "MashVoice_$($pkg.version)_x64_Portable.zip"
          if (Test-Path $portableExe) {
            $stageDir = Join-Path $env:RUNNER_TEMP "MashVoice-Portable"
            New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
            Copy-Item $portableExe (Join-Path $stageDir "MashVoice.exe") -Force
            Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath -Force
            gh release upload $tag $zipPath scripts/install-mashvoice.ps1 --clobber
          } else {
            gh release upload $tag scripts/install-mashvoice.ps1 --clobber
          }
