name: MashVoice Rust + Tauri v2 Release & Auto-Updater

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    if: github.repository == 'MyMasha/MashVoice'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check if Release Assets Were Already Uploaded Locally
        id: check_local
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $tag = "${{ github.ref_name }}"
          if ($tag -like "v*") {
            $json = gh release view $tag --repo "${{ github.repository }}" --json assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) {
              $rel = $json | ConvertFrom-Json
              $hasExe = $rel.assets | Where-Object { $_.name -like "*.exe" }
              if ($hasExe) {
                Write-Host "Release $tag possede deja les binaires .exe publies en local — skip du build cloud !"
                "already_published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                $global:LASTEXITCODE = 0
                exit 0
              }
            }
          }
          "already_published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $global:LASTEXITCODE = 0
          exit 0

      - uses: actions/checkout@v4
        if: steps.check_local.outputs.already_published != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check_local.outputs.already_published != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.check_local.outputs.already_published != 'true'
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        if: steps.check_local.outputs.already_published != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install UI dependencies
        if: steps.check_local.outputs.already_published != 'true'
        run: npm ci

      - name: Build & Publish Rust Tauri v2 Windows Release (.exe / .msi) + Signed Auto-Updater
        if: steps.check_local.outputs.already_published != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
        with:
          tagName: v__VERSION__
          releaseName: 'MashVoice Singularity v__VERSION__ (Windows x64 • Stream 4K 120FPS Sans Freeze & MashKrisp IA)'
          releaseBody: |
            ### ✨ MashVoice Singularity v__VERSION__ (Windows x64 • Rust + Tauri v2)
            - **🚫 Zéro Barre Flottante en Jeu** : La barre Windows/WebView2 (`partage votre écran`) est automatiquement détectée et masquée en arrière-plan (< 75 ms).
            - **🎞️ Choix Complet Stream (`720p, 1080p, 2K, 4K` & `15, 30, 60, 120 FPS`)** : Nouvelle fenêtre de lancement + sélecteur en direct jusqu'à 4K 120 FPS.
            - **🧊 Correctif Anti-Freeze Minecraft & OpenGL Plein Écran** : Désactivation native `CalculateNativeWinOcclusion` + Anti-EcoQoS Windows 11 + Watchdog WebRTC.
            - **🛡️ MashKrisp™ IA + Réparation Micro 1-Clic + Auto-Updater Sans SmartScreen & Changelog**.

            #### ⚡ Installation Rapide Sans Pop-Up Bleue SmartScreen (PowerShell)
            ```powershell
            irm https://github.com/MyMasha/MashVoice/releases/latest/download/install-mashvoice.ps1 | iex
            ```
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true

      - name: Package Portable ZIP & Upload SmartScreen-Free Installer Script
        if: steps.check_local.outputs.already_published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          $portableExe = "src-tauri/target/release/mashvoice-tauri.exe"
          $zipPath = "MashVoice_$($pkg.version)_x64_Portable.zip"
          if (Test-Path $portableExe) {
            $stageDir = Join-Path $env:RUNNER_TEMP "MashVoice-Portable"
            New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
            Copy-Item $portableExe (Join-Path $stageDir "MashVoice.exe") -Force
            Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath -Force
            gh release upload $tag $zipPath scripts/install-mashvoice.ps1 --clobber
          } else {
            gh release upload $tag scripts/install-mashvoice.ps1 --clobber
          }
