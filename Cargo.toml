[workspace]
resolver = "2"
members = [
  "crates/mashvoice-core",
  "crates/mashvoice-server",
]
default-members = [
  "crates/mashvoice-core",
  "crates/mashvoice-server",
]
exclude = [
  "src-tauri",
]

[workspace.package]
version = "1.0.7"
edition = "2021"
authors = ["MyMasha <https://github.com/MyMasha/MashVoice>"]
license = "MIT"
repository = "https://github.com/MyMasha/MashVoice"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
